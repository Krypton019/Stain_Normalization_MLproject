[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "stain-norm"
version = "0.1.0"
description = "Stain normalisation as optimal transport (CS1503)"
requires-python = ">=3.9"
# Runtime deps are listed in requirements.txt; keep pyproject minimal
# so Kaggle's pre-installed packages aren't re-downloaded unnecessarily.
dependencies = []

[tool.setuptools.packages.find]
# Makes `src` importable as a package after `pip install -e .`
where = ["."]
include = ["src*"]
